<!DOCTYPE html>
<html lang="zh-CN" data-level="2">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>棋格幻境 · 第二关 楼梯虚空</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Rock+Salt&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/game.css">
<!-- The inverted pool (js/poolflip.js) lives in this same page: its canvas waits hidden over this one until the player is deep in the water under the ladder. -->
<link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&display=swap" rel="stylesheet">
<style>
  #c{position:fixed;inset:0;width:100%;height:100%;display:none;outline:none;cursor:pointer;z-index:5;background:#000}
  #dot{position:fixed;left:50%;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;border-radius:50%;background:rgba(225,255,235,.38);pointer-events:none;display:none;z-index:6}
  #book{position:fixed;left:50%;top:50%;width:min(430px,82vw);transform:translate(-50%,-50%) rotate(-2deg);background:#fff8dc;color:#35424a;border-radius:10px;padding:26px 30px 22px;
    font:22px/1.35 'Gochi Hand','Comic Sans MS','Segoe Print',cursive;box-shadow:0 18px 60px rgba(0,0,0,.55),inset 0 0 0 6px #ffd84a;display:none;pointer-events:none;z-index:7}
  #ep{position:fixed;left:0;top:0;display:none;pointer-events:none;transform:translate(-50%,-140%);font:700 22px/1 system-ui,sans-serif;z-index:7}
  #ep b{display:block;min-width:30px;padding:7px 9px;text-align:center;border-radius:9px;background:#fff8dc;color:#17402b}
  #err{position:fixed;left:12px;bottom:12px;max-width:80vw;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;color:#f99;white-space:pre-wrap;display:none;z-index:8}
</style>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
  "three-mesh-bvh":"https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.7/build/index.module.js"
}}
</script>
</head>
<body>
<canvas id="gl" tabindex="0" aria-label="棋格幻境 Checkered Paradox"></canvas>
<p id="nogl" hidden>这个浏览器不支持 WebGL2，画面无法显示。请换用新版 Chrome、Edge、Safari 或 Firefox。<br>This browser has no WebGL2. Try a current Chrome, Edge, Safari or Firefox.</p>
<canvas id="c" tabindex="0"></canvas>
<div id="dot"></div>
<div id="book"></div>
<div id="ep"><b>E</b></div>
<div id="err"></div>
<input id="mf" type="file" accept="audio/*" style="display:none">
<script src="js/save.js"></script>
<script src="js/sizegun.js"></script>

<script src="js/hub.js"></script>
<script src="js/hubpc.js"></script>
<script src="js/main.js"></script>
</body>
</html>
